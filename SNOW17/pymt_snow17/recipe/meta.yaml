{% set data = load_setup_py_data() %}

package:
  name: "pymt_snow17"
  version: {{ data.get('version') }}

source:
  path: ..

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv"

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
  host:
    - python
    - pip
    - cython
    - numpy 1.11.*
    - model_metadata
  run:
    - python
    - {{ pin_compatible('numpy') }}

test:
  requires:
    - bmi-tester
    - model_metadata
  imports:
    - pymt_snow17
  commands:
    - config_file=$(mmd-stage SNOW17 . > MANIFEST && mmd-query SNOW17 --var=run.config_file.path)
    - bmi-test pymt_snow17.bmi:SNOW17 --config-file=$config_file --manifest=MANIFEST -v

about:
  summary: Python package that wraps the pymt_snow17 BMI.
  home: https://github.com/vaishswami/pymt_snow17
  license: Apache Software License 2.0
  license_file: LICENSE
  dev_url: https://github.com/vaishswami/pymt_snow17
