[library.SMP]
language = "c++"
library = "smpbmi"
header = "bmi_soil_moisture_profile.hxx"
entry_point = "BmiSoilMoistureProfile"

[build]
include_dirs = [
    "/workspace/smp/include",
    "/workspace/smp/bmi",
    "/workspace/smp/src"
]

library_dirs = [
    "/workspace/smp/build"
]

[package]
name = "pymt_smp"
requirements = []

[info]
github_username = "vaishswami"
package_author = "Vaishali Swaminathan"
package_author_email = ""
package_license = "MIT License"
summary = "Python BMI wrapper for NOAA-OWP Soil Moisture Profiles"

[ci]
os = ["linux"]
python_version = ["3.11"]
